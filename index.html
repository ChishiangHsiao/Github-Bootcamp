<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="todo-card" aria-labelledby="page-title">
        <header class="card-header">
          <p class="eyebrow">把每件事，一步一步完成</p>
          <div class="title-row">
            <h1 id="page-title">待辦清單</h1>
            <button
              class="theme-toggle"
              id="theme-toggle"
              type="button"
              aria-label="切換深淺色模式"
            ></button>
          </div>
          <p class="subtitle">寫下今天想完成的事吧。</p>
        </header>

        <form class="todo-form" id="todo-form">
          <label class="visually-hidden" for="todo-input">新增待辦事項</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="例如：完成今天的閱讀"
            autocomplete="off"
            maxlength="200"
          >
          <button class="add-button" type="submit">新增</button>
        </form>

        <nav class="filter-bar" aria-label="篩選待辦事項">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
        </nav>

        <p class="storage-error" id="storage-error" role="alert" hidden></p>

        <ul class="todo-list" id="todo-list" aria-label="待辦事項"></ul>
        <p class="empty-message" id="empty-message"></p>

        <footer class="card-footer">
          <p class="todo-count" id="todo-count" aria-live="polite">未完成:0 項</p>
        </footer>
      </section>
    </main>
  </body>
</html>
